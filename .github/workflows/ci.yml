name: SecureScan CI
on:
  push:
    branches: [main, "feature/**", "fix/**", "release/**", "test/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: securescan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli-tests:
    name: CLI and regression checks — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gettext, intl, json, mbstring, openssl, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check 'Babel==2.18.0'
      - run: python tools/compile_locales.py
      - run: bash tools/run-cli-tests.sh "${{ matrix.php }}"
      - run: node --check public/js/securescan-wait.js
  package:
    name: Build installable SecureScan ZIP
    needs: cli-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check 'Babel==2.18.0'
      - run: python tools/compile_locales.py
      - name: Build and validate installation package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip
          bash scripts/package.sh "$RUNNER_TEMP/securescan-dist"
          archive="$RUNNER_TEMP/securescan-dist/securescan-2.0.0.zip"
          test -f "$archive"
          test -f "$archive.sha256"
          unzip -t "$archive"
          if unzip -Z1 "$archive" | grep -Eq '^securescan/(tests|tools|scripts|.github)(/|$)|^securescan/HANDOFF[.]md$'; then
            echo "Development files leaked into the installation ZIP." >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: securescan-2.0.0-installable
          path: ${{ runner.temp }}/securescan-dist/securescan-2.0.0.zip*
          if-no-files-found: error
          retention-days: 14
